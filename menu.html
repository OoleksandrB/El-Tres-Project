<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>El Tres — Café</title>
  <style>
    :root {
      --brand:       #E1A6AD;
      --brand-light: #F0C8CC;
      --brand-dark:  #C8848D;
      --brand-muted: #F9EEF0;
      --bg:          #fff;
      --bg2:         #f9f9f9;
      --text:        #111;
      --text2:       #666;
      --text3:       #888;
      --border:      #f0f0f0;
      --shadow:      rgba(225,166,173,.18);
      --nav-bg:      #fff;
    }
    [data-theme="dark"] {
      --bg:          #111;
      --bg2:         #1a1a1a;
      --text:        #f0f0f0;
      --text2:       #aaa;
      --text3:       #777;
      --border:      #2a2a2a;
      --shadow:      rgba(0,0,0,.35);
      --nav-bg:      #161616;
      --brand-muted: #2a1e20;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased;
      transition: background .3s, color .3s;
    }

    /* ─── HERO ─── */
    .hero {
      position: relative; height: 260px;
      background: linear-gradient(135deg, var(--brand-dark), var(--brand), var(--brand-light));
      overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .hero::before {
      content:""; position:absolute; top:-40px; right:-40px;
      width:180px; height:180px; border-radius:50%; background:rgba(255,255,255,.12);
    }
    .hero::after {
      content:""; position:absolute; bottom:-20px; left:-20px;
      width:120px; height:120px; border-radius:50%; background:rgba(255,255,255,.10);
    }
    .hero-logo {
      width:520px; max-width:90vw; height:auto; margin-bottom:10px; position:relative; z-index:1;
      display:block; object-fit:contain;
    }
    .hero h1 { font-size:28px; font-weight:800; color:#fff; letter-spacing:-.5px; position:relative; z-index:1; }
    .hero p  { color:rgba(255,255,255,.80); font-size:13px; margin-top:6px; position:relative; z-index:1; }
    .hero-fade { position:absolute; bottom:0; left:0; right:0; height:30px; background:linear-gradient(to top,#fff,transparent); }

    /* ─── LANG ─── */
    .lang-btn {
      position:absolute; top:14px; right:14px; z-index:10;
      background:rgba(255,255,255,.22); border:1.5px solid rgba(255,255,255,.35);
      color:#fff; border-radius:999px; padding:5px 14px; font-size:13px; font-weight:600;
      cursor:pointer; display:flex; align-items:center; gap:6px;
    }
    .lang-dropdown {
      position:absolute; top:48px; right:14px; z-index:99;
      background:var(--bg); border-radius:14px; box-shadow:0 8px 24px var(--shadow);
      overflow:hidden; min-width:150px; display:none;
    }
    .lang-dropdown.open { display:block; }
    .lang-option { display:flex; align-items:center; gap:8px; padding:10px 16px; font-size:14px; cursor:pointer; transition:background .15s; color:var(--text); }
    .lang-option:hover { background:var(--brand-muted); }
    .lang-option.active { background:var(--brand-muted); font-weight:700; color:var(--brand-dark); }

    /* ─── CART BTN in nav ─── */
    .nav-row { display:flex; align-items:center; justify-content:space-between; max-width:960px; margin:0 auto; padding:0 8px; }
    .cart-nav-btn {
      flex:none; display:flex; align-items:center; gap:6px;
      background:var(--brand); color:#fff; border:none; border-radius:999px;
      padding:7px 14px; font-size:13px; font-weight:700; cursor:pointer;
      transition:background .15s, transform .1s; white-space:nowrap;
    }
    .cart-nav-btn:hover { background:var(--brand-dark); }
    .cart-nav-btn:active { transform:scale(.96); }
    .cart-count {
      background:#fff; color:var(--brand-dark);
      border-radius:999px; font-size:11px; font-weight:800;
      padding:1px 6px; min-width:18px; text-align:center;
      display:none;
    }
    .cart-count.has-items { display:inline-block; }

    /* ─── SEARCH ─── */
    .search-bar {
      display:none; padding:8px 12px 10px;
      border-top:1px solid #f0f0f0;
    }
    .search-bar.open { display:block; }
    .search-input-wrap { position:relative; max-width:960px; margin:0 auto; }
    .search-input {
      width:100%; padding:9px 36px 9px 14px; border-radius:999px;
      border:1.5px solid var(--brand-light); font-size:14px;
      outline:none; background:var(--brand-muted); color:#111;
      transition:border-color .2s;
    }
    .search-input:focus { border-color:var(--brand-dark); }
    .search-clear {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      background:none; border:none; font-size:16px; cursor:pointer;
      color:#aaa; display:none; line-height:1;
    }
    .search-clear.visible { display:block; }
    .search-empty { text-align:center; padding:40px 16px; color:#aaa; font-size:15px; display:none; }
    .search-empty.visible { display:block; }

    /* ─── DARK MODE TOGGLE + IG ─── */
    .theme-btn, .ig-btn {
      position:absolute; top:14px; z-index:10;
      background:rgba(255,255,255,.22); border:1.5px solid rgba(255,255,255,.35);
      color:#fff; border-radius:999px; width:36px; height:36px;
      cursor:pointer; display:flex; align-items:center; justify-content:center;
      font-size:16px; transition:background .2s; text-decoration:none;
    }
    .theme-btn { left:14px; }
    .ig-btn { left:58px; }
    .theme-btn:hover, .ig-btn:hover { background:rgba(255,255,255,.35); }

    /* ─── ENTRANCE ANIMATION ─── */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(24px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .hero-logo { animation: fadeUp .6s cubic-bezier(.22,1,.36,1) both; }
    .card { opacity:0; animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }

    /* ─── STICKY NAV ─── */
    .cat-nav {
      position:sticky; top:0; z-index:40; background:var(--nav-bg);
      border-bottom:1px solid var(--border); box-shadow:0 1px 6px rgba(0,0,0,.05);
      transition: background .3s;
    }
    .cat-nav-inner {
      display:flex; gap:6px; padding:8px 12px;
      overflow-x:auto; scrollbar-width:none; flex:1;
    }
    .cat-nav-inner::-webkit-scrollbar { display:none; }
    .cat-tab {
      flex:none; display:flex; align-items:center; gap:5px;
      padding:7px 16px; border-radius:999px; font-size:14px; font-weight:600;
      color:#666; cursor:pointer; border:none; background:transparent;
      transition:background .15s, color .15s; white-space:nowrap;
    }
    .cat-tab:hover { color:var(--brand-dark); background:var(--brand-muted); }
    .cat-tab.active { background:var(--brand); color:#fff; }

    /* ─── CONTENT ─── */
    .content { max-width:960px; margin:0 auto; }

    /* ─── SECTION ─── */
    .menu-section { padding:28px 16px 8px; scroll-margin-top:56px; }
    .section-title { display:flex; align-items:center; gap:8px; font-size:19px; font-weight:800; color:var(--text); margin-bottom:18px; }
    .section-title span { font-size:22px; }

    /* ─── GRID ─── */
    .cards-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    @media(min-width:600px) { .cards-grid { grid-template-columns:repeat(3,1fr); } }
    @media(min-width:900px) { .cards-grid { grid-template-columns:repeat(4,1fr); } }

    /* ─── CARD ─── */
    .card {
      background:var(--bg); border-radius:18px; overflow:hidden;
      box-shadow:0 2px 12px var(--shadow);
      transition:box-shadow .2s, transform .2s, background .3s; cursor:pointer;
    }
    .card:hover { box-shadow:0 6px 24px var(--shadow); transform:translateY(-2px); }
    .card.sold-out { opacity:.45; filter:grayscale(.8); pointer-events:none; }
    .sold-out-badge {
      position:absolute; top:8px; right:8px;
      background:rgba(0,0,0,.55); color:#fff;
      font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px;
    }
    .card-img {
      width:100%; aspect-ratio:1/1; background:var(--brand-muted);
      display:flex; align-items:center; justify-content:center; font-size:52px;
      overflow:hidden;
    }
    .card-img img { width:100%; height:100%; object-fit:cover; display:block; }
    .card-body { padding:10px 11px 12px; }
    .card-name { font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-desc { font-size:11px; color:var(--text3); margin-top:3px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.5; }
    .card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:7px; gap:4px; }
    .card-price { font-size:14px; font-weight:800; color:var(--brand-dark); }
    .card-tags { display:flex; gap:4px; flex-wrap:wrap; }
    .tag { font-size:10px; font-weight:600; padding:2px 7px; border-radius:999px; }
    .tag-popular  { background:var(--brand); color:#fff; }
    .tag-veg      { background:#dcfce7; color:#15803d; }
    .tag-healthy  { background:#d1fae5; color:#065f46; }
    .tag-seasonal { background:#fef3c7; color:#b45309; }

    /* ─── SPECIALS ─── */
    .specials-section { background:var(--brand-muted); padding:28px 16px; scroll-margin-top:56px; }
    .specials-title { display:flex; align-items:center; gap:8px; font-size:19px; font-weight:800; color:var(--text); margin-bottom:6px; }
    .specials-sub { font-size:13px; color:#888; margin-bottom:16px; margin-left:30px; }
    .specials-scroll { display:flex; gap:14px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
    .specials-scroll::-webkit-scrollbar { display:none; }
    .special-card { flex:none; width:220px; background:var(--bg); border-radius:18px; overflow:hidden; box-shadow:0 2px 12px var(--shadow); cursor:pointer; transition:transform .2s; }
    .special-card:hover { transform:translateY(-2px); }
    .special-card-img { width:100%; height:130px; background:var(--brand-light); display:flex; align-items:center; justify-content:center; font-size:48px; position:relative; }
    .special-badge { position:absolute; top:8px; left:8px; background:var(--brand); color:#fff; font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; }
    .special-card-body { padding:10px 12px 12px; }
    .special-card-body .card-name { font-size:13px; }
    .special-card-body .card-desc { font-size:11px; }
    .special-card-body .card-price { font-size:14px; display:block; margin-top:7px; }

    /* ─── ABOUT ─── */
    .about-section { padding:32px 16px 40px; scroll-margin-top:56px; max-width:960px; margin:0 auto; }
    .about-title { font-size:20px; font-weight:800; margin-bottom:20px; }
    .about-grid { display:grid; gap:12px; grid-template-columns:1fr; }
    @media(min-width:500px) { .about-grid { grid-template-columns:1fr 1fr; } }
    .about-card { background:var(--brand-muted); border-radius:18px; padding:18px; }
    .about-card-head { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; margin-bottom:8px; }
    .about-card p, .about-card a { font-size:13px; color:var(--text2); line-height:1.7; text-decoration:none; }
    .about-card a { color:var(--brand-dark); font-weight:600; }
    .about-card a:hover { text-decoration:underline; }
    .contact-links { display:flex; flex-direction:column; gap:4px; }
    .about-wide { grid-column:1/-1; }

    /* ─── FOOTER ─── */
    footer { text-align:center; padding:24px 16px; font-size:12px; color:var(--text3); border-top:1px solid var(--border); }

    /* ══════════════════════════════════════
       MODAL — ITEM DETAIL
    ══════════════════════════════════════ */
    .modal-overlay {
      position:fixed; inset:0; z-index:200;
      background:rgba(0,0,0,0);
      display:flex; align-items:flex-end; justify-content:center;
      pointer-events:none;
      transition:background .3s;
    }
    .modal-overlay.open {
      background:rgba(0,0,0,.45);
      pointer-events:all;
    }
    .modal {
      width:100%; max-width:520px;
      background:var(--bg); border-radius:28px 28px 0 0;
      padding:0 0 calc(env(safe-area-inset-bottom) + 24px);
      transform:translateY(100%);
      transition:transform .38s cubic-bezier(.32,1.1,.6,1);
      will-change:transform;
      overflow-y:auto;
      max-height:92vh;
    }
    .modal-overlay.open .modal {
      transform:translateY(0);
    }
    /* drag handle */
    .modal-handle {
      width:40px; height:4px; border-radius:99px;
      background:#ddd; margin:12px auto 0;
    }
    /* big emoji / image area */
    .modal-img {
      width:100%; height:300px;
      background:var(--brand-muted);
      display:flex; align-items:center; justify-content:center;
      font-size:80px;
      margin-top:12px;
      overflow:hidden;
      flex-shrink:0;
    }
    .modal-body { padding:20px 22px 0; }
    .modal-tags { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
    .modal-name { font-size:22px; font-weight:800; color:var(--text); line-height:1.2; }
    .modal-desc { font-size:14px; color:var(--text2); margin-top:8px; line-height:1.6; }
    .modal-price { font-size:26px; font-weight:800; color:var(--brand-dark); margin-top:14px; }

    /* quantity row */
    .modal-qty-row {
      display:flex; align-items:center; gap:14px; margin-top:18px;
    }
    .qty-btn {
      width:38px; height:38px; border-radius:50%; border:2px solid var(--brand);
      background:#fff; color:var(--brand-dark); font-size:20px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background .15s, transform .1s; user-select:none;
    }
    .qty-btn:hover { background:var(--brand-muted); }
    .qty-btn:active { transform:scale(.9); }
    .qty-num { font-size:20px; font-weight:800; min-width:24px; text-align:center; }

    /* add to cart btn */
    .modal-add-btn {
      flex:1; padding:14px; border-radius:16px; border:none;
      background:var(--brand); color:#fff; font-size:16px; font-weight:700;
      cursor:pointer; transition:background .15s, transform .1s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .modal-add-btn:hover { background:var(--brand-dark); }
    .modal-add-btn:active { transform:scale(.97); }

    /* ── CART DRAWER ── */
    .cart-overlay {
      position:fixed; inset:0; z-index:300;
      background:rgba(0,0,0,0);
      display:flex; align-items:flex-end; justify-content:center;
      pointer-events:none; transition:background .3s;
    }
    .cart-overlay.open { background:rgba(0,0,0,.45); pointer-events:all; }
    .cart-drawer {
      width:100%; max-width:520px; background:var(--bg);
      border-radius:28px 28px 0 0;
      padding:0 0 calc(env(safe-area-inset-bottom) + 24px);
      max-height:85vh; overflow-y:auto;
      transform:translateY(100%);
      transition:transform .38s cubic-bezier(.32,1.1,.6,1);
    }
    .cart-overlay.open .cart-drawer { transform:translateY(0); }
    .cart-drawer-handle { width:40px; height:4px; border-radius:99px; background:#ddd; margin:12px auto 0; }
    .cart-drawer-head {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 22px 0; font-size:20px; font-weight:800;
    }
    .cart-close {
      width:32px; height:32px; border-radius:50%; border:none;
      background:#f5f5f5; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    }
    .cart-items { padding:12px 22px 0; }
    .cart-item {
      display:flex; align-items:center; gap:12px;
      padding:12px 0; border-bottom:1px solid #f5f5f5;
    }
    .cart-item-emoji { font-size:32px; flex:none; width:44px; text-align:center; }
    .cart-item-info { flex:1; min-width:0; }
    .cart-item-name { font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cart-item-price { font-size:13px; color:var(--brand-dark); font-weight:600; margin-top:2px; }
    .cart-item-qty-row { display:flex; align-items:center; gap:8px; flex:none; }
    .cqty-btn {
      width:28px; height:28px; border-radius:50%; border:1.5px solid var(--brand);
      background:#fff; color:var(--brand-dark); font-size:16px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; transition:background .12s;
    }
    .cqty-btn:hover { background:var(--brand-muted); }
    .cqty-num { font-size:15px; font-weight:800; min-width:18px; text-align:center; }
    .cart-empty { text-align:center; padding:40px 20px; color:#aaa; font-size:15px; }
    .cart-empty-icon { font-size:48px; display:block; margin-bottom:10px; }
    .cart-total-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:16px 22px 0; font-size:16px; font-weight:800;
    }
    .cart-total-price { color:var(--brand-dark); font-size:22px; }
    .cart-order-btn {
      margin:14px 22px 0; width:calc(100% - 44px);
      padding:16px; border-radius:16px; border:none;
      background:var(--brand); color:#fff; font-size:16px; font-weight:700;
      cursor:pointer; transition:background .15s, transform .1s;
    }
    .cart-order-btn:hover { background:var(--brand-dark); }
    .cart-order-btn:active { transform:scale(.98); }
    .cart-order-btn:disabled { background:#ddd; color:#aaa; cursor:default; }

    /* ── TOAST ── */
    .toast {
      position:fixed; bottom:100px; left:50%; transform:translateX(-50%) translateY(20px);
      background:#222; color:#fff; border-radius:999px;
      padding:10px 20px; font-size:14px; font-weight:600;
      opacity:0; pointer-events:none; z-index:500;
      transition:opacity .25s, transform .25s;
      white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── FLY ANIMATION ── */
    @keyframes flyToCart {
      0%   { transform:scale(1) translateY(0); opacity:1; }
      60%  { transform:scale(.5) translateY(-60px); opacity:.8; }
      100% { transform:scale(.1) translateY(-120px); opacity:0; }
    }
    .fly-emoji {
      position:fixed; pointer-events:none; z-index:999;
      font-size:36px; animation:flyToCart .55s ease-in forwards;
    }

    /* ─── GROUPS ─── */
    .group-header {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 0 8px; cursor:pointer; user-select:none;
      border-bottom:1.5px solid var(--border); margin-bottom:12px;
    }
    .group-header-left { display:flex; align-items:center; gap:8px; }
    .group-header-emoji { font-size:18px; }
    .group-header-name { font-size:15px; font-weight:700; color:var(--text); }
    .group-header-count { font-size:12px; color:var(--text3); font-weight:500; }
    .group-chevron {
      font-size:13px; color:var(--text3); transition:transform .25s;
      display:inline-block;
    }
    .group-chevron.open { transform:rotate(180deg); }
    .group-body { overflow:hidden; transition:max-height .3s ease, opacity .25s; }
    .group-body.collapsed { max-height:0 !important; opacity:0; }
    .group-wrap { margin-bottom:20px; }

    /* ─── CHECKOUT ─── */
    .order-type-btn {
      flex:1; padding:10px 6px; border-radius:14px; border:2px solid var(--border);
      background:var(--bg2); font-size:12px; font-weight:600; cursor:pointer;
      transition:border-color .15s, background .15s; text-align:center; line-height:1.4;
    }
    .order-type-btn.active { border-color:var(--brand); background:var(--brand-muted); color:var(--brand-dark); }
    .order-type-btn.disabled { opacity:.5; pointer-events:none; position:relative; }
    .order-type-btn .soon-badge { display:inline-block; background:var(--brand); color:#fff; font-size:9px; padding:1px 6px; border-radius:6px; margin-left:4px; vertical-align:middle; font-weight:700; letter-spacing:.5px; }
    .checkout-field { margin-bottom:14px; }
    .checkout-field label { display:block; font-size:12px; color:var(--text2); margin-bottom:4px; font-weight:600; }
    .checkout-input {
      width:100%; padding:10px 14px; border-radius:12px;
      border:1.5px solid var(--border); font-size:14px;
      background:var(--bg); color:var(--text); outline:none;
      transition:border-color .2s; -webkit-appearance:none;
    }
    .checkout-input:focus { border-color:var(--brand-dark); }
    .table-num-btn {
      width:44px; height:44px; border-radius:12px; border:2px solid var(--border);
      background:var(--bg2); font-size:16px; font-weight:700; cursor:pointer;
      transition:border-color .15s, background .15s;
    }
    .table-num-btn.active { border-color:var(--brand); background:var(--brand-muted); color:var(--brand-dark); }
    .addr-suggestions {
      position:absolute; left:0; right:0; top:100%; z-index:50;
      background:var(--bg); border:1.5px solid var(--border); border-top:none;
      border-radius:0 0 12px 12px; overflow:hidden; box-shadow:0 4px 16px var(--shadow);
    }
    .addr-suggestion {
      padding:10px 14px; font-size:13px; cursor:pointer;
      border-bottom:1px solid var(--border); transition:background .1s;
    }
    .addr-suggestion:last-child { border-bottom:none; }
    .addr-suggestion:hover { background:var(--brand-muted); }
  </style>
</head>
<body>

<!-- ═══════════ DATA ═══════════ -->
<script>
const CONFIG = {
  whatsapp: "34692842996",
  tables:   [1, 2, 3, 4, 5],

<!-- ═══════════ JS ═══════════ -->
<script>
let currentLang = localStorage.getItem("lang") || "es";
if (!["es","en","ru","uk"].includes(currentLang)) currentLang = "es";
const urlParams = new URLSearchParams(window.location.search);
const tableNumber = urlParams.get("table") || null;
let orderType = null;
let selectedTable = null;
let cart = [];          // [{item, qty}]
let modalItem = null;
let modalQtyVal = 1;

/* ─── helpers ─── */
function fmt(price) { return price.toFixed(2).replace(".",",") + " €"; }
function tagClass(t) { return t==="popular"?"tag-popular":t==="vegetarian"?"tag-veg":t==="healthy"?"tag-healthy":"tag-seasonal"; }
function tagLabel(t)  { return UI[currentLang].tags[t] || t; }
function allItems() {
  const d = MENU[currentLang];
  return [
    ...d.categories.flatMap(c => c.groups ? c.groups.flatMap(g=>g.items) : c.items)
  ];
}

/* ─── card html ─── */
function renderCard(item) {
  return `<div class="card${item.soldOut ? ' sold-out' : ''}" onclick="openModal('${item.id}', this)">
    <div class="card-img" style="position:relative${item.imageContain ? ';background:#fff' : ''}">${item.image ? `<img src="${item.image}" alt="${item.name}" loading="lazy"${item.imageContain ? ' style="object-fit:contain"' : ''}>` : item.emoji}${item.soldOut ? `<span class="sold-out-badge">${UI[currentLang].soldOut}</span>` : ''}</div>
    <div class="card-body">
      <div class="card-name">${item.name}</div>
      <div class="card-desc">${item.desc}</div>
      <div class="card-footer">
        <span class="card-price">${fmt(item.price)}</span>
        <div class="card-tags">${item.tags.slice(0,2).map(t=>`<span class="tag ${tagClass(t)}">${tagLabel(t)}</span>`).join("")}</div>
      </div>
    </div>
  </div>`;
}

/* ─── group toggle ─── */
function toggleGroup(id) {
  const body = document.getElementById("grp-" + id);
  const chev = document.getElementById("chev-" + id);
  if (!body) return;
  const isOpen = !body.classList.contains("collapsed");
  if (isOpen) {
    body.style.maxHeight = body.scrollHeight + "px";
    requestAnimationFrame(()=>{ body.style.maxHeight = "0"; body.classList.add("collapsed"); });
  } else {
    body.classList.remove("collapsed");
    body.style.maxHeight = body.scrollHeight + "px";
    setTimeout(()=>{ body.style.maxHeight = "none"; }, 320);
  }
  chev?.classList.toggle("open", isOpen ? false : true);
}

/* ─── render ─── */
function render() {
  const ui   = UI[currentLang];
  const data = MENU[currentLang];

document.getElementById("langFlag").textContent    = LANGS[currentLang].flag;
  document.getElementById("langLabel").textContent   = LANGS[currentLang].label;

  // lang dropdown
  document.getElementById("langDropdown").innerHTML = Object.entries(LANGS).map(([k,v])=>
    `<div class="lang-option ${k===currentLang?"active":""}" onclick="setLang('${k}')">
      <span>${v.flag}</span><span>${v.label}</span></div>`
  ).join("");

  // nav tabs
  const tabs = [...data.categories.map(c=>({id:c.id,label:c.name,emoji:c.emoji})), {id:"about",label:ui.about,emoji:"📍"}];
  document.getElementById("catNav").innerHTML = tabs.map(t=>
    `<button class="cat-tab" data-id="${t.id}" onclick="scrollToSection('${t.id}')"><span>${t.emoji}</span>${t.label}</button>`
  ).join("");

  // menu sections
  const content = document.getElementById("menuContent");
  content.innerHTML = data.categories.map(cat=>`
    <section class="menu-section" id="${cat.id}">
      <div class="section-title"><span>${cat.emoji}</span>${cat.name}</div>
      ${cat.groups ? cat.groups.map(g=>`
        <div class="group-wrap">
          <div class="group-header" onclick="toggleGroup('${cat.id}-${g.id}')">
            <div class="group-header-left">
              <span class="group-header-emoji">${g.emoji||''}</span>
              <span class="group-header-name">${g.name}</span>
              <span class="group-header-count">${g.items.length}</span>
            </div>
            <span class="group-chevron open" id="chev-${cat.id}-${g.id}">▼</span>
          </div>
          <div class="group-body" id="grp-${cat.id}-${g.id}">
            <div class="cards-grid" style="padding-top:4px">
              ${g.items.map(item=>renderCard(item)).join("")}
            </div>
          </div>
        </div>`).join("") : `
      <div class="cards-grid">
        ${cat.items.map(item=>renderCard(item)).join("")}
      </div>`}
    </section>`).join("");

  // specials
  const sp = data.specials;
  content.innerHTML += `
    <section class="specials-section" id="specials">
      <div class="specials-title"><span>✨</span>${sp.title}</div>
      <div class="specials-sub">${sp.subtitle}</div>
      <div class="specials-scroll">
        ${sp.items.map(item=>`
          <div class="special-card">
            <div class="special-card-img">${item.emoji}<span class="special-badge">${ui.specialsBadge}</span></div>
            <div class="special-card-body">
              <div class="card-name">${item.name}</div>
              <div class="card-desc">${item.desc}</div>
              ${item.price != null ? `<span class="card-price">${fmt(item.price)}</span>` : ''}
            </div>
          </div>`).join("")}
      </div>
    </section>`;

  // about
  document.getElementById("aboutSection").innerHTML = `
    <section class="about-section" id="about">
      <div class="about-title">${ui.about}</div>
      <div class="about-grid">
        <div class="about-card"><div class="about-card-head">📍 ${ui.address}</div><p><a href="https://www.google.com/maps/place/El+Tres/@38.3708006,-0.4326601,3240m/data=!3m1!1e3!4m10!1m2!2m1!1sel+tres!3m6!1s0xd62393ab71ef353:0x8c32fa1101e3ee89!8m2!3d38.3708006!4d-0.4151506!15sCgdlbCB0cmVzkgEEY2FmZeABAA!16s%2Fg%2F11n56prjw5?entry=ttu&g_ep=EgoyMDI2MDMwOC4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener">${ui.addressText}</a></p></div>
        <div class="about-card"><div class="about-card-head">🕐 ${ui.hours}</div><p>${ui.weekdays}<br>${ui.weekend}</p></div>
        <div class="about-card about-wide">
          <div class="about-card-head">📬 ${ui.contact}</div>
          <div class="contact-links">
            <a href="tel:+34692842996">📞 692 842 996</a>
            <a href="https://instagram.com/eltres.es" target="_blank" rel="noopener">📸 @eltres.es</a>
          </div>
        </div>
      </div>
    </section>`;

  // update cart label
  document.getElementById("addBtnLabel").textContent = ui.addToCart;
  document.getElementById("cartTitle").textContent   = ui.cartTitle;
  document.getElementById("cartOrderBtn").textContent = ui.orderBtn;
  document.getElementById("searchInput").setAttribute("placeholder", ui.searchPlaceholder || "Buscar...");
  updateCartUI();
  updateActiveTab();
  animateCards();
}

/* ─── lang ─── */
function setLang(lang) {
  currentLang = lang;
  localStorage.setItem("lang", lang);
  document.getElementById("langDropdown").classList.remove("open");
  render();
}
document.getElementById("langBtn").addEventListener("click", e=>{ e.stopPropagation(); document.getElementById("langDropdown").classList.toggle("open"); });
document.addEventListener("click", ()=>document.getElementById("langDropdown").classList.remove("open"));

/* ─── scroll ─── */
function scrollToSection(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const navH = document.querySelector(".cat-nav").offsetHeight;
  window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - navH - 4, behavior:"smooth" });
}
function updateActiveTab() {
  const navH = document.querySelector(".cat-nav")?.offsetHeight || 56;
  const ids = ["coffee","tea","cold","pastry","specials","about"];
  const threshold = navH + Math.round(window.innerHeight * 0.25);
  let active = ids[0];
  for (const id of ids) {
    const el = document.getElementById(id);
    if (el && el.getBoundingClientRect().top <= threshold) active = id;
  }
  document.querySelectorAll(".cat-tab").forEach(b => {
    const wasActive = b.classList.contains("active");
    b.classList.toggle("active", b.dataset.id === active);
    if (!wasActive && b.dataset.id === active) {
      b.scrollIntoView({ behavior:"smooth", block:"nearest", inline:"center" });
    }
  });
}
window.addEventListener("scroll", updateActiveTab, {passive:true});

/* ─── dark mode ─── */
function toggleTheme() {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  document.getElementById("themeBtn").textContent = dark ? "🌙" : "☀️";
  localStorage.setItem("theme", dark ? "light" : "dark");
}
(function(){
  const saved = localStorage.getItem("theme") ||
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", saved);
  document.getElementById("themeBtn").textContent = saved === "dark" ? "☀️" : "🌙";
})();

/* ─── card entrance animation ─── */
function animateCards() {
  const cards = document.querySelectorAll(".card");
  cards.forEach((card, i) => {
    card.style.animationDelay = (i * 40) + "ms";
    card.style.animationFillMode = "both";
  });
}

/* ─── haptic feedback ─── */
function haptic(style) {
  if (window.navigator && window.navigator.vibrate) {
    window.navigator.vibrate(style === "light" ? 10 : style === "medium" ? 30 : [20,10,20]);
  }
}

/* ─── search ─── */
function toggleSearch() {
  const bar = document.getElementById("searchBar");
  bar.classList.toggle("open");
  if (bar.classList.contains("open")) {
    document.getElementById("searchInput").focus();
  } else {
    clearSearch();
  }
}
function onSearch(q) {
  const val = q.trim().toLowerCase();
  document.getElementById("searchClear").classList.toggle("visible", val.length > 0);
  let total = 0;
  document.querySelectorAll(".card").forEach(card => {
    const name = (card.querySelector(".card-name")?.textContent || "").toLowerCase();
    const desc = (card.querySelector(".card-desc")?.textContent || "").toLowerCase();
    const match = !val || name.includes(val) || desc.includes(val);
    card.style.display = match ? "" : "none";
    if (match) total++;
  });
  // hide empty section titles
  document.querySelectorAll(".menu-section").forEach(sec => {
    const visible = [...sec.querySelectorAll(".card")].some(c => c.style.display !== "none");
    sec.style.display = visible ? "" : "none";
  });
  const ui = UI[currentLang];
  document.getElementById("searchEmpty").classList.toggle("visible", total === 0 && val.length > 0);
  document.getElementById("searchEmptyMsg").textContent = ui.searchEmpty || "No hay resultados";
  document.getElementById("searchInput").setAttribute("placeholder", ui.searchPlaceholder || "Buscar...");
}
function clearSearch() {
  document.getElementById("searchInput").value = "";
  onSearch("");
}

/* ══════════════════════════════════════
   MODAL
══════════════════════════════════════ */
function openModal(itemId, triggerEl) {
  const item = allItems().find(i=>i.id===itemId);
  if (!item) return;
  modalItem    = item;
  modalQtyVal  = 1;

  const modalImgEl = document.getElementById("modalImg");
  const modalSrc = item.modalImage || item.image;
  const modalPos = item.modalImagePosition || "center bottom";
  if (modalSrc) {
    modalImgEl.style.background = item.imageContain ? '#fff' : '';
    modalImgEl.innerHTML = `<img src="${modalSrc}" alt="${item.name}" style="width:100%;height:100%;object-fit:${item.imageContain ? 'contain' : 'cover'};object-position:${modalPos};display:block;">`;
  } else {
    modalImgEl.style.background = '';
    modalImgEl.textContent = item.emoji;
  }
  document.getElementById("modalName").textContent     = item.name;
  document.getElementById("modalDesc").textContent     = item.desc;
  document.getElementById("modalPrice").textContent    = fmt(item.price);
  document.getElementById("modalQty").textContent      = "1";
  document.getElementById("addBtnLabel").textContent   = UI[currentLang].addToCart;
  document.getElementById("modalTags").innerHTML = (item.tags||[]).map(t=>
    `<span class="tag ${tagClass(t)}">${tagLabel(t)}</span>`).join("");

  document.getElementById("modalOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal(e) {
  if (e && e.target !== document.getElementById("modalOverlay")) return;
  _closeModal();
}
function _closeModal() {
  document.getElementById("modalOverlay").classList.remove("open");
  document.body.style.overflow = "";
}

function changeQty(delta) {
  modalQtyVal = Math.max(1, modalQtyVal + delta);
  document.getElementById("modalQty").textContent = modalQtyVal;
}

function addToCart() {
  if (!modalItem) return;
  haptic("medium");

  // fly animation
  const imgEl = document.getElementById("modalImg");
  const rect  = imgEl.getBoundingClientRect();
  const fly   = document.createElement("div");
  fly.className = "fly-emoji";
  fly.textContent = modalItem.emoji;
  fly.style.left = rect.left + rect.width/2 - 18 + "px";
  fly.style.top  = rect.top  + rect.height/2 - 18 + "px";
  document.body.appendChild(fly);
  setTimeout(()=>fly.remove(), 600);

  // add to cart
  const existing = cart.find(c=>c.item.id===modalItem.id);
  if (existing) existing.qty += modalQtyVal;
  else cart.push({ item: modalItem, qty: modalQtyVal });

  _closeModal();
  updateCartUI();
  showToast(`${modalItem.emoji} ${modalItem.name} ×${modalQtyVal}`);
}

/* ══════════════════════════════════════
   CART
══════════════════════════════════════ */
function updateCartUI() {
  const total = cart.reduce((s,c)=>s+c.qty, 0);
  const countEl = document.getElementById("cartCount");
  countEl.textContent = total;
  countEl.classList.toggle("has-items", total > 0);
}

function openCart() {
  renderCartDrawer();
  document.getElementById("cartOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeCart() {
  document.getElementById("cartOverlay").classList.remove("open");
  document.body.style.overflow = "";
}
function closeCartEvent(e) {
  if (e.target === document.getElementById("cartOverlay")) closeCart();
}

function renderCartDrawer() {
  const ui = UI[currentLang];
  document.getElementById("cartTitle").textContent    = ui.cartTitle;
  document.getElementById("cartOrderBtn").textContent = ui.orderBtn;

  const itemsEl = document.getElementById("cartItems");
  if (cart.length === 0) {
    itemsEl.innerHTML = `<div class="cart-empty"><span class="cart-empty-icon">🛒</span>${ui.emptyCart}</div>`;
    document.getElementById("cartTotalRow").style.display  = "none";
    document.getElementById("cartOrderBtn").disabled = true;
    return;
  }

  document.getElementById("cartOrderBtn").disabled = false;
  itemsEl.innerHTML = cart.map((c,i)=>`
    <div class="cart-item">
      <div class="cart-item-emoji">${c.item.emoji}</div>
      <div class="cart-item-info">
        <div class="cart-item-name">${c.item.name}</div>
        <div class="cart-item-price">${fmt(c.item.price * c.qty)}</div>
      </div>
      <div class="cart-item-qty-row">
        <button class="cqty-btn" onclick="cartChangeQty(${i},-1)">−</button>
        <span class="cqty-num">${c.qty}</span>
        <button class="cqty-btn" onclick="cartChangeQty(${i},1)">+</button>
      </div>
    </div>`).join("");

  const total = cart.reduce((s,c)=>s+c.item.price*c.qty, 0);
  const tr = document.getElementById("cartTotalRow");
  tr.style.display = "flex";
  document.getElementById("cartTotalLabel").textContent = ui.total;
  document.getElementById("cartTotalPrice").textContent = fmt(total);
}

function cartChangeQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  updateCartUI();
  renderCartDrawer();
}

function confirmOrder() {
  closeCart();
  openCheckout();
}

/* ══════════════════════════════════════
   TOAST
══════════════════════════════════════ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ══════════════════════════════════════
   CHECKOUT
══════════════════════════════════════ */
function openCheckout() {
  orderType = tableNumber ? "table" : null;
  selectedTable = null;
  renderCheckout();
  document.getElementById("checkoutOverlay").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeCheckout() {
  document.getElementById("checkoutOverlay").classList.remove("open");
  document.body.style.overflow = "";
}
function closeCheckoutEvent(e) {
  if (e.target === document.getElementById("checkoutOverlay")) closeCheckout();
}
function selectOrderType(type) {
  if (type === 'delivery') return;
  orderType = type;
  selectedTable = null;
  document.querySelectorAll(".order-type-btn").forEach(b =>
    b.classList.toggle("active", b.dataset.type === type));
  renderCheckoutFields();
}
function selectTable(n) {
  selectedTable = n;
  document.querySelectorAll(".table-num-btn").forEach(b =>
    b.classList.toggle("active", parseInt(b.textContent) === n));
}
function renderCheckout() {
  const ui = UI[currentLang];
  document.getElementById("checkoutTitle").textContent    = ui.cartTitle;
  document.getElementById("orderTypeLabel").textContent   = ui.orderType;
  document.getElementById("checkoutSendBtn").textContent  = ui.send;
  document.getElementById("orderTypeSection").style.display = tableNumber ? "none" : "";
  const btns = document.getElementById("orderTypeBtns").children;
  btns[0].textContent = "🥡 " + ui.pickup;
  btns[1].innerHTML = "🛵 " + ui.delivery + ' <span class="soon-badge">' + ui.soon + '</span>';
  btns[1].classList.add("disabled");
  btns[1].disabled = true;
  btns[2].textContent = "🪑 " + ui.tableOrder;
  document.querySelectorAll(".order-type-btn").forEach(b =>
    b.classList.toggle("active", tableNumber ? b.dataset.type === "table" : false));
  renderCheckoutFields();
}
function renderCheckoutFields() {
  const ui = UI[currentLang];
  const el = document.getElementById("checkoutFields");
  if (orderType === "table") {
    if (tableNumber) {
      el.innerHTML = `<div class="checkout-field"><label>${ui.tableNum}</label><div style="font-size:24px;font-weight:800;color:var(--brand-dark);margin-top:2px">#${tableNumber}</div></div>`;
    } else {
      el.innerHTML = `<div class="checkout-field"><label>${ui.tableSelect}</label><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">${CONFIG.tables.map(n=>`<button class="table-num-btn${selectedTable===n?" active":""}" onclick="selectTable(${n})">${n}</button>`).join("")}</div></div>`;
    }
    return;
  }
  if (!orderType) { el.innerHTML = ""; return; }
  let html = `
    <div class="checkout-field"><label>${ui.yourName} *</label><input class="checkout-input" id="co-name" type="text" autocomplete="given-name"></div>
    <div class="checkout-field"><label>${ui.yourPhone} *</label><input class="checkout-input" id="co-phone" type="tel" autocomplete="tel"></div>`;
  if (orderType === "pickup") {
    html += `<div class="checkout-field"><label>${ui.pickupTime}</label><input class="checkout-input" id="co-time" type="time" min="09:00" max="18:00"></div>`;
  } else if (orderType === "delivery") {
    html += `<div class="checkout-field"><label>${ui.address2} *</label><div style="position:relative" id="addr-wrap"><input class="checkout-input" id="co-address" type="text" autocomplete="off" oninput="onAddressInput(this.value)" onblur="hideAddrSuggestions()" placeholder="Calle, número, piso..."><div class="addr-suggestions" id="addr-suggestions" style="display:none"></div></div></div>`;
  }
  el.innerHTML = html;
}
function submitOrder() {
  const ui = UI[currentLang];
  if (!orderType) { showToast("⚠️ " + ui.orderType); return; }
  if (orderType === "table") {
    const tbl = tableNumber || selectedTable;
    if (!tbl) { showToast("⚠️ " + ui.tableSelect); return; }
  } else {
    const name  = document.getElementById("co-name")?.value.trim();
    const phone = document.getElementById("co-phone")?.value.trim();
    if (!name || !phone) { showToast("⚠️ " + ui.yourName + " / " + ui.yourPhone); return; }
    if (orderType === "delivery") {
      const addr = document.getElementById("co-address")?.value.trim();
      if (!addr) { showToast("⚠️ " + ui.address2); return; }
    }
  }
  const items = cart.map(c=>`• ${c.qty}× ${c.item.name} — ${fmt(c.item.price*c.qty)}`).join("\n");
  const total = cart.reduce((s,c)=>s+c.item.price*c.qty, 0);
  let header = "";
  if (orderType === "table") {
    header = `🪑 ${ui.tableNum} #${tableNumber||selectedTable}`;
  } else if (orderType === "pickup") {
    const name  = document.getElementById("co-name").value.trim();
    const phone = document.getElementById("co-phone").value.trim();
    const time  = document.getElementById("co-time")?.value || "";
    header = `🥡 ${ui.pickup}\n👤 ${name}\n📞 ${phone}${time?"\n🕐 "+time:""}`;
  } else if (orderType === "delivery") {
    const name  = document.getElementById("co-name").value.trim();
    const phone = document.getElementById("co-phone").value.trim();
    const addr  = document.getElementById("co-address").value.trim();
    header = `🛵 ${ui.delivery}\n👤 ${name}\n📞 ${phone}\n📍 ${addr}`;
  }
  const message = `📋 El Tres — Nuevo pedido\n\n${header}\n\n${items}\n\n💰 Total: ${fmt(total)}`;
  cart = []; updateCartUI(); closeCheckout();
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(message)}`, "_blank");
}

/* ─── address autocomplete ─── */
let addrTimer;
function onAddressInput(val) {
  clearTimeout(addrTimer);
  const box = document.getElementById("addr-suggestions");
  if (!box) return;
  if (val.trim().length < 3) { box.style.display = "none"; return; }
  addrTimer = setTimeout(()=>fetchAddrSuggestions(val), 350);
}
async function fetchAddrSuggestions(q) {
  const box = document.getElementById("addr-suggestions");
  if (!box) return;
  try {
    const lang = (currentLang==="ru"||currentLang==="uk") ? "es" : currentLang;
    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=4&countrycodes=es&addressdetails=1`;
    const res  = await fetch(url, { headers:{"Accept-Language": lang} });
    const data = await res.json();
    if (!data.length) { box.style.display = "none"; return; }
    box.innerHTML = data.map(r => {
      const a = r.address;
      const parts = [a.road, a.house_number, a.apartment ? `apt. ${a.apartment}` : null, a.city||a.town||a.village].filter(Boolean);
      const label = parts.length ? parts.join(", ") : r.display_name.split(",").slice(0,3).join(",");
      return `<div class="addr-suggestion" onmousedown="pickAddress('${label.replace(/'/g,"\\'")}')">📍 ${label}</div>`;
    }).join("");
    box.style.display = "block";
  } catch { box.style.display = "none"; }
}
function pickAddress(val) {
  const input = document.getElementById("co-address");
  if (input) input.value = val;
  hideAddrSuggestions();
}
function hideAddrSuggestions() {
  setTimeout(()=>{ const box = document.getElementById("addr-suggestions"); if (box) box.style.display = "none"; }, 150);
}

/* ── init ── */
render();
</script>
